  <circle cx="512" cy="512" r="222" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="46"/>
  <path d="M512.0 290.0A222 222 0 1 1 330.1 639.3" fill="none" stroke="url(#o)" stroke-width="46" stroke-linecap="round" filter="url(#gl)"/>
