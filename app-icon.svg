  <line x1="274.7" y1="649.0" x2="259.1" y2="658.0" stroke="#fff" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round"/>
  <line x1="238.0" y1="512.0" x2="220.0" y2="512.0" stroke="#fff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
  <line x1="274.7" y1="375.0" x2="259.1" y2="366.0" stroke="#fff" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round"/>
