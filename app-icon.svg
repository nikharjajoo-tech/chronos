<!-- Chronos app icon ("Night Glass"): dark glass tile, frosted dial, glowing orange focus arc.
     Source for the platform icon set: npm run icons -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="cl">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="gl" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3a3e"/>
      <stop offset="1" stop-color="#161517"/>
    </linearGradient>
    <linearGradient id="o" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc061"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <filter id="in" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#b)" filter="url(#sh)" />
  <g clip-path="url(#cl)">
    <ellipse cx="512" cy="110" rx="580" ry="240" fill="#fff" opacity="0.08"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="3"/>
  <circle cx="512" cy="512" r="318" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.2" stroke-width="4" filter="url(#in)"/>
  <line x1="512.0" y1="238.0" x2="512.0" y2="220.0" stroke="#fff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
